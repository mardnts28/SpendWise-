version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spendwise-postgres
    restart: always
    environment:
      POSTGRES_DB: spendwise_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - spendwise-pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spendwise-api
    restart: always
    environment:
      PORT: 5001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: spendwise_db
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      JWT_SECRET: spendwise_production_jwt_secret_token_12345
    ports:
      - "5001:5001"
    depends_on:
      - db

volumes:
  spendwise-pgdata:
